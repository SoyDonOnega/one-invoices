schema: spec-driven

context: |
  Single user: a Spanish freelancer (IRPF, VAT general regime) whose client issues the invoices by self-billing.
  Output files must match the official AEAT record design for the model and year byte for byte; the design
  version is part of every generator. Python 3.12, standard library only. Private data (PDFs, register,
  generated files) never enters the repo. Artifacts in English; no legal analysis in the repo.

